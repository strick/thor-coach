<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thor — Coach</title>
  <meta name="theme-color" content="#0b0f17" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
</head>
<body>
  <main class="container">
    <div class="page-head">
      <h1>Coach</h1>
      <span class="sub">Ask about your data, or log things in plain English</span>
    </div>
    <div class="card chat-box">
      <div class="chat-log" id="log">
        <div class="msg bot">⚡ I'm Thor, your coach. I can read and log workouts, food, runs and health events. Try:
"what did I lift this week?" · "log 3x12 goblet squats at 50" · "how's my protein today?" · "sync strava"</div>
      </div>
      <div class="chat-input">
        <textarea id="input" placeholder="Talk to your coach…" rows="2"></textarea>
        <button id="send" class="fit">Send</button>
      </div>
    </div>
  </main>
  <script type="module" src="js/chat.js"></script>
</body>
</html>
