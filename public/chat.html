<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thor — Ask Thor</title>
  <meta name="theme-color" content="#0b0f17" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
</head>
<body>
  <main class="container">
    <div class="page-head">
      <h1>Ask Thor</h1>
      <div class="row fit" style="gap:8px">
        <button class="btn-ghost btn-sm fit" id="btn-memory">What Thor remembers</button>
        <button class="btn-ghost btn-sm fit" id="btn-new">New conversation</button>
      </div>
    </div>

    <div class="card mb" id="memory-card" hidden>
      <div class="row-between">
        <h2>What Thor remembers</h2>
        <span class="muted small">Used in every answer and summary. Say "remember…" in chat, or add one here.</span>
      </div>
      <div id="memories" class="list"></div>
      <div class="row mt">
        <div><input id="memory-new" maxlength="500" placeholder="e.g. My doctor wants my LDL under 100 by next spring" /></div>
        <button class="btn-ghost fit" id="btn-memory-add">Add</button>
      </div>
    </div>

    <div class="card chat-box">
      <div class="chat-log" id="log"></div>
      <div class="chat-input">
        <textarea id="input" placeholder="Ask anything…" rows="2"></textarea>
        <button id="send" class="fit">Send</button>
      </div>
    </div>
  </main>
  <script type="module" src="js/chat.js"></script>
</body>
</html>
