<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Thor — Running</title>
  <meta name="theme-color" content="#0b0f17" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Thor" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="/icons/icon-192.png" />
</head>
<body>
  <main class="container">
    <div class="page-head">
      <h1>Training</h1>
      <span class="sub" id="strava-status"></span>
    </div>
    <div id="segs"></div>

    <section class="week-row mb" aria-label="All-time running">
      <div class="wk"><strong id="s-runs">–</strong><span>runs</span></div>
      <div class="wk"><strong id="s-miles">–</strong><span>miles</span></div>
      <div class="wk"><strong id="s-pace">–</strong><span>avg min/mi</span></div>
      <div class="wk"><strong id="s-cal">–</strong><span>calories</span></div>
    </section>

    <div class="grid cols-2 mb">
      <div class="card">
        <h2>Strava</h2>
        <p class="muted small" style="margin-top:0">New runs sync on their own when you open Today. Use these to pull a specific day or catch up.</p>
        <div class="row">
          <div class="fit" style="width:170px"><label for="sync-date">Date</label><input type="date" id="sync-date" /></div>
          <button id="btn-sync" class="fit">Sync that day</button>
          <button id="btn-backfill" class="btn-ghost fit">Catch up 30 days</button>
        </div>
        <div class="row mt" style="align-items:center">
          <button id="btn-strava-connect" class="btn-ghost btn-sm fit">Reconnect Strava</button>
          <span class="muted small">Use this if sync says the authorization is stale.</span>
        </div>
        <div id="sync-result" class="mt" aria-live="polite"></div>
        <details class="mt"><summary>Sync history</summary><div id="sync-history" class="list mt"></div></details>
      </div>

      <div class="card" id="log">
        <h2>Log a run</h2>
        <div class="row">
          <div><label for="r-date">Date</label><input type="date" id="r-date" /></div>
          <div><label for="r-dist">Distance (mi)</label><input type="number" inputmode="decimal" id="r-dist" step="0.01" /></div>
          <div><label for="r-dur">Duration (min)</label><input type="number" inputmode="decimal" id="r-dur" /></div>
        </div>
        <div class="row">
          <div><label for="r-hr">Avg heart rate</label><input type="number" inputmode="numeric" id="r-hr" /></div>
          <div><label for="r-effort">Effort</label><select id="r-effort"><option value="">—</option><option>easy</option><option>moderate</option><option>hard</option><option>tempo</option></select></div>
          <div><label for="r-surface">Surface</label><select id="r-surface"><option value="">—</option><option>road</option><option>trail</option><option>track</option><option>treadmill</option><option>mixed</option></select></div>
        </div>
        <label for="r-notes">Notes</label><input id="r-notes" />
        <button id="btn-run" class="mt">Add run</button>
      </div>
    </div>

    <div class="card mb">
      <h2>Runs</h2>
      <div id="sessions" class="list"></div>
    </div>

    <div class="card">
      <h2>Weekly mileage</h2>
      <div id="weekly"></div>
    </div>
  </main>
  <script type="module" src="js/running.js"></script>
</body>
</html>
