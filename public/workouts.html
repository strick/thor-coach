<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Thor — Training</title>
  <meta name="theme-color" content="#0b0f17" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Thor" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="/icons/icon-192.png" />
</head>
<body>
  <main class="container">
    <div class="page-head">
      <h1>Training</h1>
      <span class="sub" id="range-label"></span>
    </div>
    <div id="segs"></div>

    <div class="grid cols-2 mb">
      <div class="card">
        <h2>Describe a workout</h2>
        <label for="ai-text" class="sr-only">Workout description</label>
        <textarea id="ai-text" placeholder='"4x10 rows @50, RDLs 3x12 with 45s, hammer curls 3x10 @25 felt strong"'></textarea>
        <div class="row mt">
          <div class="fit" style="width:170px"><label for="ai-date">Date</label><input type="date" id="ai-date" /></div>
          <button id="btn-ai" class="fit">Log it</button>
        </div>
        <div id="ai-status" class="mt"></div>
        <div id="ai-results" class="list mt"></div>
      </div>

      <div class="card">
        <h2>Log a set by hand</h2>
        <label for="m-exercise">Exercise</label>
        <select id="m-exercise"></select>
        <div class="row">
          <div><label for="m-sets">Sets</label><input type="number" inputmode="numeric" id="m-sets" min="1" /></div>
          <div><label for="m-reps">Reps</label><input id="m-reps" autocomplete="off" placeholder="12 or 12,10,8" /></div>
          <div><label for="m-weight">Weight (lbs)</label><input type="number" inputmode="decimal" id="m-weight" step="2.5" /></div>
        </div>
        <div class="row">
          <div class="fit" style="width:170px"><label for="m-date">Date</label><input type="date" id="m-date" /></div>
          <div><label for="m-notes">Notes</label><input id="m-notes" placeholder="optional" /></div>
        </div>
        <button id="btn-manual" class="mt btn-ghost">Add set</button>
      </div>
    </div>

    <div class="card mb">
      <h2>History</h2>
      <div class="row mb">
        <div class="fit" style="width:160px"><label for="h-start">From</label><input type="date" id="h-start" /></div>
        <div class="fit" style="width:160px"><label for="h-end">To</label><input type="date" id="h-end" /></div>
        <button id="btn-history" class="btn-ghost fit">Show</button>
      </div>
      <div id="history" class="list"></div>
    </div>

    <div class="grid cols-2 mb">
      <div class="card">
        <h2>Progress (last 8 weeks)</h2>
        <div id="progress"><div class="empty">Loading…</div></div>
      </div>
      <div class="card">
        <div class="card-head">
          <h2>Weekly review</h2>
          <a class="btn btn-ghost btn-sm fit" href="guides.html">Library ›</a>
        </div>
        <p class="muted small">Training, running, food, headaches and sleep for the week, in one read.</p>
        <button id="btn-weekly" class="btn-ghost btn-sm mb">Write last week's review</button>
        <div id="weekly"></div>
      </div>
    </div>

    <div class="card">
      <h2>Plan editor</h2>
      <div class="row mb">
        <div class="fit" style="width:170px"><label for="pe-day">Day</label>
          <select id="pe-day">
            <option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option>
            <option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option>
            <option value="7">Sunday</option>
          </select></div>
      </div>
      <div id="pe-list" class="list mb"></div>
      <div class="row">
        <div><label for="pe-name">New exercise</label><input id="pe-name" placeholder="Dumbbell Pullover" /></div>
        <div><label for="pe-aliases">Other names (comma separated)</label><input id="pe-aliases" placeholder="pullover, db pullover" /></div>
        <button id="pe-add" class="btn-ghost fit">Add to day</button>
      </div>
    </div>
  </main>
  <script type="module" src="js/workouts.js"></script>
</body>
</html>
