<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thor — Workouts</title>
  <meta name="theme-color" content="#0b0f17" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
</head>
<body>
  <main class="container">
    <div class="page-head">
      <h1>Workouts</h1>
      <span class="sub" id="range-label"></span>
    </div>

    <div class="grid cols-2 mb">
      <div class="card">
        <h2><span class="accent">⚡</span> Log with AI</h2>
        <textarea id="ai-text" placeholder='"4x10 rows @50, RDLs 3x12 with 45s, hammer curls 3x10 @25 felt strong"'></textarea>
        <div class="row mt">
          <div class="fit" style="width:160px"><label>Date</label><input type="date" id="ai-date" /></div>
          <button id="btn-ai" class="fit">Parse & log</button>
        </div>
        <div id="ai-results" class="list mt"></div>
      </div>

      <div class="card">
        <h2>Manual log</h2>
        <label>Exercise</label>
        <select id="m-exercise"></select>
        <div class="row">
          <div><label>Sets</label><input type="number" id="m-sets" min="1" /></div>
          <div><label>Reps (12 or 12,10,8)</label><input id="m-reps" placeholder="12 or 12,10,8" /></div>
          <div><label>Weight (lbs)</label><input type="number" id="m-weight" step="2.5" /></div>
        </div>
        <div class="row">
          <div class="fit" style="width:160px"><label>Date</label><input type="date" id="m-date" /></div>
          <div><label>Notes</label><input id="m-notes" placeholder="optional" /></div>
        </div>
        <button id="btn-manual" class="mt btn-ghost">Add log</button>
      </div>
    </div>

    <div class="card mb">
      <h2>History</h2>
      <div class="row mb">
        <div class="fit" style="width:150px"><label>From</label><input type="date" id="h-start" /></div>
        <div class="fit" style="width:150px"><label>To</label><input type="date" id="h-end" /></div>
        <button id="btn-history" class="btn-ghost fit">Load</button>
      </div>
      <div id="history" class="list"></div>
    </div>

    <div class="grid cols-2 mb">
      <div class="card">
        <h2>Progress (last 8 weeks)</h2>
        <div id="progress"><div class="empty">Loading…</div></div>
      </div>
      <div class="card">
        <h2>Weekly summaries</h2>
        <button id="btn-weekly" class="btn-gold btn-sm mb">Generate this week's summary</button>
        <div id="weekly" class="list"></div>
      </div>
    </div>

    <div class="card">
      <h2>Plan editor</h2>
      <div class="row mb">
        <div class="fit" style="width:160px"><label>Day</label>
          <select id="pe-day">
            <option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option>
            <option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option>
            <option value="7">Sunday</option>
          </select></div>
      </div>
      <div id="pe-list" class="list mb"></div>
      <div class="row">
        <div><label>New exercise</label><input id="pe-name" placeholder="Dumbbell Pullover" /></div>
        <div><label>Aliases (comma-sep)</label><input id="pe-aliases" placeholder="pullover, db pullover" /></div>
        <button id="pe-add" class="btn-ghost fit">Add to day</button>
      </div>
    </div>
  </main>
  <script type="module" src="js/workouts.js"></script>
</body>
</html>
