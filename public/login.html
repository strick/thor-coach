<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Thor</title>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    .login-wrap { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 40px 36px; max-width: 360px; width: 100%; text-align: center;
    }
    .login-brand { font-size: 28px; font-weight: 800; letter-spacing: 2px; }
    .login-brand .bolt { color: var(--gold); }
    .login-sub { color: var(--muted); font-size: 13px; margin: 8px 0 28px; }
    .login-msg { font-size: 13px; margin: 0 0 18px; padding: 10px 12px; border-radius: 8px;
      background: var(--accent-soft); color: var(--text); }
    .login-msg.error { background: rgba(255, 93, 93, 0.12); color: var(--danger); }
    .ms-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
      padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border);
      background: #1a2334; color: var(--text); font-weight: 600; font-size: 15px; text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .ms-btn:hover { background: #202b40; border-color: var(--accent); }
    .login-note { color: var(--muted); font-size: 11px; margin-top: 22px; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="login-wrap">
    <div class="login-card">
      <div class="login-brand"><span class="bolt">⚡</span> THOR</div>
      <p class="login-sub">Workouts · Nutrition · Running · Health</p>
      <p id="login-msg" class="login-msg" hidden></p>
      <a id="ms-btn" class="ms-btn" href="/auth/login">
        <svg width="18" height="18" viewBox="0 0 23 23" aria-hidden="true">
          <rect x="1" y="1" width="10" height="10" fill="#f25022"/>
          <rect x="12" y="1" width="10" height="10" fill="#7fba00"/>
          <rect x="1" y="12" width="10" height="10" fill="#00a4ef"/>
          <rect x="12" y="12" width="10" height="10" fill="#ffb900"/>
        </svg>
        Sign in with Microsoft
      </a>
      <p class="login-note">Only pre-approved accounts can sign in.<br/>Your data never leaves this app.</p>
    </div>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
