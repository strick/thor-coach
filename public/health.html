<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thor — Health</title>
  <meta name="theme-color" content="#0b0f17" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
</head>
<body>
  <main class="container">
    <div class="page-head"><h1>Health events</h1><span class="sub">migraines · sleep · activity</span></div>

    <div class="grid cols-2 mb">
      <div class="card">
        <h2>Log event</h2>
        <div class="row">
          <div><label>Date</label><input type="date" id="e-date" /></div>
          <div><label>Category</label>
            <select id="e-cat"><option>migraine</option><option>sleep</option><option>yardwork</option><option>run</option><option>other</option></select></div>
        </div>
        <div class="row">
          <div><label>Intensity (1–10)</label><input type="number" id="e-int" min="1" max="10" /></div>
          <div><label>Duration (min)</label><input type="number" id="e-dur" /></div>
        </div>
        <label>Notes</label><input id="e-notes" />
        <button id="btn-event" class="mt">Log event</button>
      </div>
      <div class="card">
        <h2>Last 90 days</h2>
        <div id="cat-stats"></div>
      </div>
    </div>

    <div class="card">
      <h2>Recent events</h2>
      <div id="events" class="list"></div>
    </div>
  </main>
  <script type="module" src="js/health.js"></script>
</body>
</html>
