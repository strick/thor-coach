name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check browser JS parses
        run: for f in public/js/*.js; do node --check "$f"; done
      - name: Run tests
        run: npm test
